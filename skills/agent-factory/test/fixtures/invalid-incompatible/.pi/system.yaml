schema: 1
name: incompatible-system
models:
  tiers:
    high: { model: openai-codex/gpt-5.6-terra, thinking: medium }
    small: { model: deepseek/deepseek-v4-flash, thinking: high }
  parentTier: high
  subagents: { scout: small }
orchestrator:
  name: orchestrator
  model: high
  tools: [read, bash]
agents:
  - name: seo-analyst
    model: small
    tools: [read]
integrations:
  mcp:
    - name: openseo
      config: { url: "http://localhost:3002/mcp" }
policies:
  enforced:
    - agent: seo-analyst
      tools: [read]
    - mcp: missing-server
      hide: ["publish_*"]
