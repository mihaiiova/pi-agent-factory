# coding-agent compatibility fixture — the existing pi-config coding-agent
# setup expressed as a `system.yaml`. This gates schema changes (spec 1):
# `factory validate` must accept it. Generation of the tree below is a later
# spec; see expected-tree.md and capability-checklist.md.
schema: 1
name: coding-agent-system
description: "Pi coding agent: spec lifecycle, subagents, model routing, GitHub ops"

models:
  tiers:
    high: { model: openai-codex/gpt-5.6-terra, thinking: medium }
    medium: { model: deepseek/deepseek-v4-pro, thinking: high }
    small: { model: deepseek/deepseek-v4-flash, thinking: high }
  parentTier: high
  subagents: { worker: medium, scout: small, reviewer: small, oracle: high }

orchestrator:
  name: orchestrator
  description: "Primary coding agent that plans and coordinates specialist subagents"
  prompt: |
    You are a coding agent. Discover work with /spec-backlog and /spec-audit,
    implement with /spec-start (test-first), verify with /spec-review, and
    integrate with /spec-close. Delegate discovery to the scout, implementation
    to the worker, and review to the reviewer. Never merge or push without
    approval; keep secrets out of committed files.
  model: high
  tools: [read, grep, find, ls, bash, edit, write, subagent]

agents:
  - name: scout
    description: "Read-only discovery: explores the codebase and reports findings"
    tools: [read, grep, find, ls]
    model: small
    prompt: |
      You investigate the codebase and report precise, source-referenced findings.
      You have no write access.
  - name: worker
    description: "Single-writer implementation subagent (red-green-refactor loop)"
    tools: [read, grep, find, ls, bash, edit, write]
    model: medium
    prompt: |
      You implement the assigned slice test-first, committing coherent checkpoints.
  - name: reviewer
    description: "Read-only review: verifies implementation against the spec"
    tools: [read, grep, find, ls, bash]
    model: small
    prompt: |
      You review changes against the spec and acceptance criteria without editing.
  - name: oracle
    description: "High-tier reasoning subagent for hard design decisions"
    tools: [read, grep, find, ls]
    model: high
    prompt: |
      You reason about difficult design and architecture questions and recommend a path.

skills:
  - name: spec-new
    description: "Discover and define a new spec or epic (provided by the pinned pi-config package)"
    external: true
  - name: spec-start
    description: "Begin implementing a ready spec (provided by the pinned pi-config package)"
    external: true
  - name: spec-review
    description: "Verify a spec's implementation (provided by the pinned pi-config package)"
    external: true
  - name: spec-close
    description: "Integrate a reviewed spec (provided by the pinned pi-config package)"
    external: true
  - name: tdd
    description: "Red-green-refactor loop (provided by the pinned pi-config package)"
    external: true
  - name: code-review
    description: "Code review procedure (provided by the pinned pi-config package)"
    external: true

integrations:
  mcp:
    - name: cloudflare
      config: { command: npx, args: ["cloudflare-mcp", "--stdio"] }
  env:
    - { name: GH_TOKEN, secret: true }

workflows:
  - name: spec-new
    description: "Discover and define a new spec or epic"
    skill: spec-new
    trigger: { kind: manual }
    entry: orchestrator
    agents: [scout, worker]
    inputs: []
    outputs: []
    approval: publish-spec
    verify: "the spec issue is published with a spec:ready label"
  - name: spec-start
    description: "Implement a ready spec on its branch, test-first"
    skill: spec-start
    trigger: { kind: manual }
    entry: orchestrator
    agents: [scout, worker]
    inputs: []
    outputs: []
    approval: none
    verify: "tests pass and the branch carries coherent checkpoint commits"
  - name: spec-review
    description: "Verify the implementation against acceptance criteria"
    skill: spec-review
    trigger: { kind: manual }
    entry: orchestrator
    agents: [reviewer]
    inputs: []
    outputs: []
    approval: none
    verify: "the review passes the spec.checks"
  - name: spec-close
    description: "Merge the reviewed branch and close the spec"
    skill: spec-close
    trigger: { kind: manual }
    entry: orchestrator
    agents: [worker, reviewer]
    inputs: []
    outputs: []
    approval: merge
    verify: "the spec branch is merged and the label is spec:done"

policies:
  enforced:
    - agent: scout
      tools: [read, grep, find, ls]
    - agent: reviewer
      tools: [read, grep, find, ls, bash]
    - agent: worker
      tools: [read, grep, find, ls, bash, edit, write]
  advisory:
    - "Never commit secrets: keep tokens in env vars or gitignored files."
    - "Merging to development and pushing releases requires explicit user approval."
